<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a6cf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="六级单词">
<meta name="format-detection" content="telephone=no">
<title>六级单词记忆</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:#f5f6fa;color:#1f2430;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:env(safe-area-inset-bottom);touch-action:manipulation}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e8eaf0;
  display:flex;align-items:center;gap:2px;
  padding:calc(8px + env(safe-area-inset-top)) 8px 8px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.logo{font-weight:700;color:#4a6cf7;font-size:15px;white-space:nowrap;margin:0 6px 0 4px}
.tab{border:0;background:none;padding:9px 12px;border-radius:9px;font-size:14px;color:#6b7280;
  cursor:pointer;white-space:nowrap;min-height:42px;font-family:inherit;touch-action:manipulation}
.tab.active{background:#eef1ff;color:#4a6cf7;font-weight:600}
@media (max-width:480px){
  .logo{display:none}
  .tab{flex:1;text-align:center;padding:10px 2px}
}

main{max-width:780px;margin:0 auto;padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
.view.hidden{display:none}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.card h3{margin:0 0 10px;font-size:16px}
.muted{color:#8a8fa3;font-size:13px}
.center{text-align:center}
.hr{border:0;border-top:1px dashed #eceef5;margin:16px 0}

/* 按钮 */
.btn{border:1px solid #dfe3ee;background:#fff;color:#374151;padding:11px 18px;border-radius:10px;
  font-size:15px;cursor:pointer;margin:6px 8px 0 0;font-family:inherit;
  min-height:44px;touch-action:manipulation;transition:background .15s}
.btn:hover{background:#f7f8fc}
.btn.primary{background:#4a6cf7;border-color:#4a6cf7;color:#fff}
.btn.primary:hover{background:#3a56d4}
.btn.success{background:#0f7b52;border-color:#0f7b52;color:#fff}
.btn.danger{color:#e5484d;border-color:#f5c6c8}
.btn.mini{padding:7px 12px;font-size:13px;min-height:36px;margin:0;border-radius:8px}
.btn.big-btn{display:block;width:100%;padding:15px;font-size:16px;margin:10px 0 0;text-align:center}

/* 输入 */
.ta,.inp{width:100%;border:1px solid #dfe3ee;border-radius:10px;padding:11px 12px;
  font-size:16px;font-family:inherit;outline:none;background:#fbfcfe;margin-top:4px;
  -webkit-appearance:none;appearance:none}
.ta:focus,.inp:focus{border-color:#4a6cf7;background:#fff}
label{font-size:13px;color:#6b7280;display:block;margin-top:12px}

/* 通用 */
.big{font-size:clamp(38px,12vw,48px);font-weight:800;line-height:1.1;color:#4a6cf7}
.mini-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#6b7280}
.mini-row span b{color:#1f2430}
.ok-text{color:#0f7b52;font-weight:600}
.bad-text{color:#b42318;font-weight:600}

/* 选择题 */
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:6px;background:#e8eaf0;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#4a6cf7;transition:width .3s}
.quiz-word{font-size:clamp(30px,9.5vw,42px);font-weight:700;margin:24px 0 26px;
  letter-spacing:.5px;word-break:break-word;line-height:1.2}
.options{display:grid;gap:10px}
.opt{border:1px solid #dfe3ee;background:#fff;border-radius:12px;padding:14px 16px;
  font-size:16px;cursor:pointer;text-align:left;transition:.15s;font-family:inherit;color:#374151;
  min-height:52px;line-height:1.4;touch-action:manipulation}
.opt:disabled{cursor:default}
.opt.ok{background:#e9f8f1;border-color:#22a06b;color:#0f7b52;font-weight:600}
.opt.bad{background:#fdecec;border-color:#e5484d;color:#b42318}
.feedback{margin-top:16px;min-height:22px;font-size:15px}

/* 文章 */
.art-title{font-size:clamp(18px,5.5vw,22px);margin:2px 0 18px;text-align:center;line-height:1.4}
.para{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed #eceef5}
.para:last-child{border-bottom:0;padding-bottom:0}
.para .en{font-size:16px;line-height:1.85;margin:0 0 10px;color:#111827}
.para .zh{font-size:16px;line-height:2.5;margin:0;color:#4b5563}
input.blank{border:0;border-bottom:2px solid #c7cbe0;background:#f7f8ff;
  border-radius:4px 4px 0 0;padding:2px 6px;font:inherit;font-size:16px;color:#4a6cf7;
  text-align:center;outline:none;min-width:60px;max-width:62vw;margin:2px;
  height:38px;vertical-align:middle;-webkit-appearance:none;appearance:none;
  transition:background .15s,border-color .15s}
input.blank:focus{border-bottom-color:#4a6cf7;background:#eef1ff}
input.blank.ok{color:#0f7b52;border-bottom-color:#22a06b;background:#e9f8f1}
input.blank.bad{color:#b42318;border-bottom-color:#e5484d;background:#fdecec}
input.blank.reveal{color:#8a8fa3;border-bottom-color:#c7cbe0;background:#f3f4f6}
.ans-label{color:#0f7b52;font-weight:600;margin:0 3px;font-size:15px}

/* 文章底部操作条 */
#view-article{padding-bottom:80px}
.sticky-actions{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);max-width:756px;z-index:30;
  display:flex;gap:8px;padding:8px;
  background:rgba(255,255,255,.97);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid #e8eaf0;border-radius:14px;
  box-shadow:0 6px 20px rgba(16,24,40,.12)}
.sticky-actions .btn{flex:1;margin:0;padding:12px 4px;font-size:14px;min-height:46px}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;margin:10px 0}
.tbl th{text-align:left;font-size:12px;color:#8a8fa3;font-weight:500;padding:6px 8px;border-bottom:1px solid #eceef5}
.tbl td{padding:6px 8px;border-bottom:1px solid #f3f4f8;vertical-align:middle}
.tbl td.w{font-weight:600;color:#1f2430;width:40%;word-break:break-word}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#eef1ff;color:#4a6cf7}
.tag.master{background:#e9f8f1;color:#0f7b52}

/* 词库列表 */
.li-row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #f3f4f8;flex-wrap:wrap}
.li-row:last-child{border-bottom:0}
.li-row .w{font-weight:600;word-break:break-word}
.li-row .m{flex:1 1 130px;color:#4b5563;font-size:14px;word-break:break-word}
.li-row .next{font-size:12px;color:#8a8fa3;min-width:0}
.x{color:#c7cbe0;cursor:pointer;border:0;background:none;font-size:22px;line-height:1;
  padding:4px 8px;min-width:36px;min-height:36px;touch-action:manipulation}
.x:hover{color:#e5484d}

.warn{border:1px solid #f5c6c8;background:#fff7f7}
@media (max-width:420px){
  .card{padding:14px;border-radius:12px}
  .li-row .next{display:none}
  .para .en{font-size:15px}
  .para .zh{font-size:15px;line-height:2.4}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">六级单词</div>
  <button class="tab active" data-tab="home">今日</button>
  <button class="tab" data-tab="import">导入</button>
  <button class="tab" data-tab="lib">词库</button>
  <button class="tab" data-tab="settings">设置</button>
</div>

<main>
  <section id="view-home" class="view"></section>
  <section id="view-import" class="view hidden"></section>
  <section id="view-lib" class="view hidden"></section>
  <section id="view-settings" class="view hidden"></section>
  <section id="view-quiz" class="view hidden"></section>
  <section id="view-article" class="view hidden"></section>
</main>

<script>
/* ============================================================
   基础工具
============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const DAY = 86400000;

/* 记忆曲线：阶段 -> 下次复习间隔（天） */
const INTERVALS   = [0, 1, 2, 4, 7, 15, 30, 60, 120];
const STAGE_LABEL = ['新词','1天','2天','4天','7天','15天','30天','60天','已掌握'];

/* 文章模式用多少个词 */
const ARTICLE_LIMIT = 16;

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* 本地存储可用性检测 */
let storageOK = true;
try{ localStorage.setItem('__probe__','1'); localStorage.removeItem('__probe__'); }
catch(e){ storageOK = false; }

/* ============================================================
   数据层
============================================================ */
const DB_KEY = 'cet6_srs_v1';
let S = {
  words: {},
  settings: { apiBase:'https://api.deepseek.com/v1', apiKey:'', model:'deepseek-chat' }
};

function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const o = JSON.parse(raw);
      S.words = o.words || {};
      S.settings = Object.assign(S.settings, o.settings || {});
    }
  }catch(e){ console.warn('load fail', e); }
}
function save(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(S)); }catch(e){}
}

/* ============================================================
   视图切换
============================================================ */
function showView(name){
  $$('.view').forEach(v => v.classList.add('hidden'));
  const el = document.getElementById('view-' + name);
  if(el) el.classList.remove('hidden');
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  window.scrollTo(0, 0);
}
$$('.tab').forEach(t => {
  t.onclick = () => {
    const n = t.dataset.tab;
    showView(n);
    if(n === 'home')     renderHome();
    if(n === 'import')   renderImport();
    if(n === 'lib')      renderLib();
    if(n === 'settings') renderSettings();
  };
});

/* ============================================================
   记忆曲线
============================================================ */
function reviewWord(word, ok){
  const w = S.words[word]; if(!w) return;
  if(ok){ w.stage = Math.min(w.stage + 1, 8); w.correct = (w.correct||0) + 1; }
  else  { w.stage = 0; w.wrong = (w.wrong||0) + 1; } // 答错重置为0，明天重来
  w.nextReview    = Date.now() + INTERVALS[w.stage] * DAY;
  w.lastReviewDay = todayStr();
  save();
}

/* 文章模式逻辑 */
function applyArticleResult(word, ok){
  const w = S.words[word]; if(!w) return;
  if(ok) w.correct = (w.correct||0) + 1;
  else   w.wrong   = (w.wrong||0) + 1;

  if(w.lastReviewDay !== todayStr()){
    w.stage = ok ? Math.min(w.stage + 1, 8) : 0;
    w.lastReviewDay = todayStr();
  }
  w.nextReview = Date.now() + INTERVALS[w.stage] * DAY;
  save();
}

/* 今日待复习（按顺序提取全部到期单词） */
function getDueWords(){
  const now = Date.now(), today = todayStr();
  return Object.values(S.words)
    .filter(w => w.nextReview <= now && w.lastReviewDay !== today)
    .sort((a,b) => a.nextReview - b.nextReview || a.stage - b.stage)
    .map(w => w.word);
}

function pickArticleWords(limit){
  const now = Date.now();
  const map = new Map();
  Object.values(S.words).forEach(w => {
    if(w.nextReview <= now) map.set(w.word, w);
    else if(w.addedAt && now - w.addedAt < 5 * DAY) map.set(w.word, w);
  });
  return Array.from(map.values())
    .sort((a,b) => a.stage - b.stage || (a.nextReview||0) - (b.nextReview||0))
    .slice(0, limit);
}

/* ============================================================
   首页
============================================================ */
function renderHome(){
  const now = Date.now(), today = todayStr();
  const all = Object.values(S.words);
  const dueWords = getDueWords();
  const total = dueWords.length;

  $('#view-home').innerHTML = `
    ${storageOK ? '' : `<div class="card warn">
      <b class="bad-text">⚠ 当前浏览器无法保存数据</b>
      <p class="muted" style="margin:6px 0 0">请用 Safari 或 Chrome 打开，否则关闭页面后单词和进度会丢失。</p>
    </div>`}

    <div class="card">
      <div class="big">${total}</div>
      <div class="muted">今日待复习</div>
      <div class="mini-row">
        <span>词库 <b>${all.length}</b></span>
        <span>已掌握 <b>${all.filter(w => w.stage >= 8).length}</b></span>
      </div>
    </div>

    <div class="card">
      <h3>开始复习</h3>
      <p class="muted" style="margin:0 0 10px">记忆曲线：新词 → 1天 → 2天 → 4天 → 7天 → 15天 → 30天 → 60天 → 已掌握</p>
      
      ${total > 0 ? `
        ${total > 20 ? `<button class="btn primary big-btn" onclick="startQuiz('all')">📝 复习全部 (${total}个)</button>` : ''}
        <button class="btn ${total > 20 ? '' : 'primary'} big-btn" onclick="startQuiz(20)">⚡ 快速复习 20 个</button>
        <button class="btn big-btn" onclick="startArticle()">📖 文章填空复习</button>
      ` : `
        <div class="center" style="padding:20px 0">
          <div style="font-size:36px;margin-bottom:10px">🎉</div>
          <div style="font-weight:600">今日任务已完成</div>
          <div class="muted" style="margin-top:4px">明天再来巩固记忆吧</div>
        </div>
        <button class="btn" onclick="startArticle()" style="width:100%">📖 随机生成文章阅读</button>
      `}
    </div>
  `;
}

/* ============================================================
   导入与智能解析
============================================================ */
function renderImport(){
  $('#view-import').innerHTML = `
    <div class="card">
      <h3>导入单词</h3>
      <p class="muted">每行一个单词，支持逗号、冒号、空格分隔。<br>
      系统已经升级为智能解析，直接粘贴即可。</p>
      <textarea id="impText" class="ta" rows="10"
        placeholder="abandon,放弃&#10;abandon 放弃&#10;abandon:放弃"></textarea>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px">
        <button class="btn primary" id="parseBtn" style="margin:0">解析并预览</button>
        <button class="btn" id="pasteBtn" style="margin:0">从剪贴板粘贴</button>
      </div>
    </div>
    <div id="impPreview"></div>
  `;

  $('#parseBtn').onclick = doParse;

  $('#pasteBtn').onclick = async () => {
    try{
      const t = await navigator.clipboard.readText();
      if(!t){ alert('剪贴板是空的'); return; }
      const box = $('#impText');
      box.value = box.value.trim() ? box.value.replace(/\s*$/,'') + '\n' + t : t;
    }catch(e){
      alert('无法读取剪贴板，请长按输入框手动粘贴');
    }
  };
}

function parseLine(line){
  line = line.trim();
  if(!line || line.startsWith('#') || line.startsWith('```')) return null;
  
  // 智能识别：英文单词（可能带空格），跟着空格或符号，然后是中文或解释
  const m = line.match(/^([a-zA-Z][a-zA-Z\s'’\-]*?)[\s,，:：\t]+([^a-zA-Z].*)$/);
  if(m) return { word: m[1].trim().toLowerCase(), meaning: m[2].trim() };

  // 纯英文单词（没有中文，需自己填或自动翻译）
  if(/^[A-Za-z][A-Za-z'’\-]*(?:\s+[A-Za-z][A-Za-z'’\-]*)*$/.test(line))
    return { word: line.toLowerCase(), meaning: '' };
  return null;
}

async function doParse(){
  const raw = $('#impText').value;
  const seen = new Set(), parsed = [];
  raw.split(/\r?\n/).forEach(line => {
    const p = parseLine(line);
    if(p && !seen.has(p.word)){ seen.add(p.word); parsed.push(p); }
  });
  if(!parsed.length){ alert('没有解析到单词，请检查是不是混入了大量符号或特殊字符'); return; }

  renderPreview(parsed);
}

function renderPreview(parsed){
  const rows = parsed.map((p, i) => `
    <tr>
      <td class="w">${esc(p.word)}</td>
      <td><input class="inp" data-i="${i}" value="${esc(p.meaning || '')}" placeholder="请填写释义"></td>
    </tr>`).join('');

  $('#impPreview').innerHTML = `
    <div class="card">
      <h3>预览确认</h3>
      <table class="tbl">
        <thead><tr><th>单词</th><th>释义</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <button class="btn primary" id="confirmImp" style="margin:0">确认导入 (${parsed.length}个)</button>
    </div>`;

  $('#confirmImp').onclick = () => {
    let added = 0, skipped = 0;
    $$('#impPreview input.inp').forEach(inp => {
      const p = parsed[+inp.dataset.i];
      const meaning = inp.value.trim();
      if(!meaning){ skipped++; return; }
      
      if(S.words[p.word]){
        S.words[p.word].meaning = meaning; // 覆盖旧释义
      }else{
        S.words[p.word] = {
          word: p.word, meaning,
          stage: 0, nextReview: Date.now(), addedAt: Date.now(), // nextReview=当前时间，意味着马上可以复习
          correct: 0, wrong: 0, lastReviewDay: null
        };
        added++;
      }
    });
    save();
    alert(`成功导入 ${added} 个单词${skipped ? `，跳过 ${skipped} 个无释义单词` : ''}`);
    showView('home');
    renderHome();
  };
}

/* ============================================================
   选择题复习（百词斩错词循环模式）
============================================================ */
let quiz = null;
const FILLER_MEANINGS = ['显著的','推测','阻碍','消耗','仁慈的','模糊的','谨慎的','丰富的','矛盾','促进'];

function startQuiz(limit){
  const dueWords = getDueWords();
  if(!dueWords.length){ alert('今天没有需要复习的单词'); return; }
  
  const words = limit === 'all' ? dueWords : dueWords.slice(0, limit);
  
  quiz = { 
    queue: [...words], 
    originalTotal: words.length,
    idx: 0, 
    right: 0, 
    wrong: 0 
  };
  showView('quiz');
  renderQuiz();
}

function endQuiz(){
  quiz = null;
  showView('home');
  renderHome();
}

function makeOptions(w){
  const correct = w.meaning;
  const pool = Array.from(new Set(
    Object.values(S.words).filter(x => x.word !== w.word).map(x => x.meaning)
  )).filter(m => m && m !== correct);

  shuffle(pool);
  const opts = [correct, ...pool.slice(0, 3)];
  let fi = 0;
  while(opts.length < 4){
    const f = FILLER_MEANINGS[fi++ % FILLER_MEANINGS.length];
    if(!opts.includes(f)) opts.push(f);
  }
  return shuffle(opts);
}

function renderQuiz(){
  const el = $('#view-quiz');

  if(!quiz || quiz.idx >= quiz.queue.length){
    const right = quiz ? quiz.right : 0;
    const total = quiz ? quiz.originalTotal : 0;
    const extra = quiz ? quiz.queue.length - quiz.originalTotal : 0;
    el.innerHTML = `<div class="card center">
        <div style="font-size:40px;margin-bottom:10px">🎉</div>
        <h2>本轮完成</h2>
        <p>今天记住了 <b class="ok-text">${total}</b> 个单词</p>
        ${extra > 0 ? `<p class="muted">（纠正错词 ${extra} 次）</p>` : ''}
        <button class="btn primary" style="margin-top:20px" onclick="endQuiz()">返回首页</button>
      </div>`;
    return;
  }

  const word = quiz.queue[quiz.idx];
  const w = S.words[word];
  const opts = makeOptions(w);

  // 进度条基于最初的总词数，哪怕错词加了进来，进度条也不会倒流
  const progress = Math.min(100, (quiz.idx / quiz.originalTotal) * 100);

  el.innerHTML = `
    <div class="quiz-top">
      <span class="muted">${quiz.idx + 1} / ${quiz.queue.length}</span>
      <div class="bar"><i style="width:${progress}%"></i></div>
      <button class="btn mini" onclick="endQuiz()">结束</button>
    </div>
    <div class="card center">
      <div class="quiz-word">${esc(word)}</div>
      <div class="options">
        ${opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}
      </div>
      <div class="feedback" id="quizFeedback"></div>
    </div>`;

  $$('#view-quiz .opt').forEach(b => {
    b.onclick = () => answerQuiz(b, word, w.meaning);
  });
}

function answerQuiz(btn, word, correct){
  const ok = btn.dataset.o === correct;

  $$('#view-quiz .opt').forEach(b => {
    b.disabled = true;
    if(b.dataset.o === correct) b.classList.add('ok');
  });
  if(!ok) btn.classList.add('bad');

  if(ok) {
    quiz.right++;
    reviewWord(word, true);
    $('#quizFeedback').innerHTML = `<span class="ok-text">✓ 正确</span>`;
    setTimeout(() => { quiz.idx++; renderQuiz(); }, 500);
  } else {
    quiz.wrong++;
    reviewWord(word, false); // 记录错误，阶段归0
    quiz.queue.push(word);   // 【核心逻辑】错词重新塞回本轮末尾！
    
    $('#quizFeedback').innerHTML = `<span class="bad-text">✗ 正确答案：${esc(correct)}</span><br><span class="muted">马上会再出现一次</span>`;
    setTimeout(() => { quiz.idx++; renderQuiz(); }, 1800);
  }
}

/* ============================================================
   文章填空复习（保持不变）
============================================================ */
let currentArticleWords = [];

function buildPrompt(words){
  const list = words.map(w => `${w.word} — ${w.meaning}`).join('\n');
  return `你是一名大学英语六级备考助教。请用下面列出的单词写一篇英语短文。

要求：
1. 分 5-7 段，每段 3-5 句，主题统一、自然连贯，语言难度符合大学英语六级水平。
2. 必须用到下面【全部】单词，每个至少出现一次（可使用适当的词形变化）。
3. 只返回严格的 JSON，不要任何 markdown 代码块标记、解释或多余文字。

JSON 结构：
{
  "title": "英文标题",
  "paragraphs": [
    {
      "en": "该段英文原文",
      "zh": "该段中文译文。其中每一个目标单词对应的中文意思，必须写成 [[单词|中文意思]] 的形式。"
    }
  ]
}

示例：
{"title":"A New Start","paragraphs":[{"en":"He abandoned the plan.","zh":"他最终[[abandon|放弃了]]那个计划。"}]}

目标单词列表（单词 — 中文意思）：
${list}`;
}

function startArticle(){
  const words = pickArticleWords(ARTICLE_LIMIT);
  if(words.length < 3){
    alert('词库里可用的单词太少（至少需要 3 个），先去导入吧～');
    return;
  }
  currentArticleWords = words;
  if(S.settings.apiKey) generateArticle(words);
  else renderArticleStart(words);
}

function renderArticleStart(words){
  const prompt = buildPrompt(words);
  showView('article');

  $('#view-article').innerHTML = `
    <div class="card">
      <h3>生成文章（手动模式）</h3>
      <p class="muted">复制下面的提示词，发给任意 AI（DeepSeek / ChatGPT / 豆包 / Kimi 都可以），再把返回的 JSON 粘贴回来。</p>
      <textarea class="ta" id="promptBox" rows="10" readonly>${esc(prompt)}</textarea>
      <button class="btn" id="copyPrompt" style="margin-top:10px">复制提示词</button>
      <hr class="hr">
      <p class="muted">粘贴 AI 返回的 JSON：</p>
      <textarea class="ta" id="jsonIn" rows="6" placeholder='{"title":"...","paragraphs":[{"en":"...","zh":"..."}]}'></textarea>
      <button class="btn primary" id="renderJson" style="margin-top:10px">渲染文章</button>
    </div>`;

  $('#copyPrompt').onclick = async () => {
    try{
      await navigator.clipboard.writeText(prompt);
      $('#copyPrompt').textContent = '已复制 ✓';
    }catch(e){
      $('#promptBox').select();
      try{ document.execCommand('copy'); }catch(err){}
      $('#copyPrompt').textContent = '已复制 ✓';
    }
    setTimeout(() => $('#copyPrompt').textContent = '复制提示词', 1500);
  };

  $('#renderJson').onclick = () => {
    try{
      renderArticle(extractJSON($('#jsonIn').value));
    }catch(e){
      alert('JSON 解析失败：' + e.message);
    }
  };
}

function extractJSON(text){
  let t = String(text || '').trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence) t = fence[1].trim();
  const s = t.indexOf('{'), e = t.lastIndexOf('}');
  if(s >= 0 && e > s) t = t.slice(s, e + 1);
  return JSON.parse(t);
}

async function callLLM(prompt){
  const base = S.settings.apiBase.replace(/\/+$/, '');
  const r = await fetch(base + '/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + S.settings.apiKey
    },
    body: JSON.stringify({
      model: S.settings.model,
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.8
    })
  });
  if(!r.ok){
    const txt = await r.text();
    throw new Error('API ' + r.status + '：' + txt.slice(0, 160));
  }
  const j = await r.json();
  return j.choices[0].message.content;
}

async function generateArticle(words){
  showView('article');
  $('#view-article').innerHTML = `<div class="card center">
      <p>正在生成文章…</p>
      <p class="muted">${words.length} 个单词</p>
    </div>`;

  try{
    const text = await callLLM(buildPrompt(words));
    renderArticle(extractJSON(text));
  }catch(e){
    $('#view-article').innerHTML = `
      <div class="card">
        <p class="bad-text">生成失败：${esc(e.message)}</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
          <button class="btn" style="margin:0" onclick="startArticle()">重试</button>
          <button class="btn" style="margin:0" onclick="renderArticleStart(currentArticleWords)">改用手动粘贴</button>
        </div>
      </div>`;
  }
}

function renderZh(zh, pi){
  let i = 0;
  return esc(zh).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (m, w, mean) => {
    const ans  = mean.trim();
    const word = w.trim().toLowerCase();
    const id   = `b${pi}_${i++}`;
    const wpx  = Math.min(200, Math.max(60, ans.length * 16 + 24));
    return `<input class="blank" id="${id}" data-answer="${esc(ans)}" data-word="${esc(word)}"
              style="width:${wpx}px" autocomplete="off" autocorrect="off"
              autocapitalize="off" spellcheck="false">`;
  });
}

function renderArticle(data){
  if(!data || !Array.isArray(data.paragraphs) || !data.paragraphs.length){
    alert('文章数据不完整');
    return;
  }
  showView('article');

  let html = `<div class="card"><h2 class="art-title">${esc(data.title || 'Untitled')}</h2>`;
  data.paragraphs.forEach((p, pi) => {
    html += `<div class="para">
      <p class="en">${esc(p.en || '')}</p>
      <p class="zh">${renderZh(p.zh || '', pi)}</p>
    </div>`;
  });
  html += `</div>
  <div class="sticky-actions">
    <button class="btn primary" id="checkAll">检查</button>
    <button class="btn" id="showAll">显示答案</button>
    <button class="btn" id="regen">换一篇</button>
  </div>`;

  $('#view-article').innerHTML = html;

  const blanks = () => Array.from(document.querySelectorAll('#view-article input.blank'));

  blanks().forEach(inp => {
    inp.addEventListener('blur', () => { if(inp.value.trim()) checkOne(inp); });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); checkOne(inp); inp.blur(); }
    });
  });

  $('#checkAll').onclick = () => {
    let unfilled = 0;
    blanks().forEach(inp => {
      if(inp.dataset.done === '1') return;
      if(!inp.value.trim()){ unfilled++; return; }
      checkOne(inp);
    });
    if(unfilled > 0) alert(`还有 ${unfilled} 个空没填`);
  };

  $('#showAll').onclick = () => {
    blanks().forEach(inp => {
      if(inp.dataset.done === '1') return;
      inp.dataset.done = '1';
      inp.classList.add('reveal');
      inp.value = inp.dataset.answer;
      inp.readOnly = true;
      applyArticleResult(inp.dataset.word, false);
    });
  };

  $('#regen').onclick = () => startArticle();
}

function normalizeCN(s){
  return String(s || '')
    .replace(/[\s，,。.、；;：:！!？?（）()【】\[\]"'“”‘’~～-]/g, '')
    .toLowerCase();
}

function matchCN(user, ans){
  const u = normalizeCN(user);
  if(!u) return false;
  const a = normalizeCN(ans);
  if(u === a) return true;

  const parts = String(ans).split(/[；;，,、\/|]/).map(normalizeCN).filter(Boolean);
  if(parts.includes(u)) return true;

  for(const p of [a, ...parts]){
    if(p && p.length >= 2 && (p.includes(u) || u.includes(p))) return true;
  }
  return false;
}

function checkOne(inp){
  if(inp.dataset.done === '1') return;
  const ans  = inp.dataset.answer;
  const user = inp.value.trim();
  if(!user) return;

  const ok = matchCN(user, ans);

  inp.dataset.done = '1';
  inp.readOnly = true;
  inp.classList.add(ok ? 'ok' : 'bad');

  if(!ok){
    const span = document.createElement('span');
    span.className = 'ans-label';
    span.textContent = ans;
    inp.after(span);
  }

  applyArticleResult(inp.dataset.word, ok);
}

/* ============================================================
   词库 & 设置（保持不变）
============================================================ */
function renderLib(){
  const all = Object.values(S.words).sort((a,b) => (b.addedAt||0) - (a.addedAt||0));
  if(!all.length){
    $('#view-lib').innerHTML = `<div class="card muted center">词库是空的</div>`;
    return;
  }
  const rows = all.map(w => {
    const nextTxt = w.stage >= 8 ? '已掌握' : new Date(w.nextReview).toLocaleDateString('zh-CN');
    return `<div class="li-row">
      <div class="w">${esc(w.word)}</div>
      <div class="m">${esc(w.meaning)}</div>
      <span class="tag ${w.stage >= 8 ? 'master' : ''}">${STAGE_LABEL[w.stage]}</span>
      <span class="next">${nextTxt}</span>
      <button class="x" data-del="${esc(w.word)}" title="删除">×</button>
    </div>`;
  }).join('');

  $('#view-lib').innerHTML = `<div class="card">
      <h3>词库（${all.length}）</h3>
      <p class="muted">阶段 = 记忆曲线进度；右侧为下次复习日期。</p>
      ${rows}
    </div>`;

  $$('#view-lib .x').forEach(b => {
    b.onclick = () => {
      if(confirm('删除 ' + b.dataset.del + ' ?')){
        delete S.words[b.dataset.del];
        save();
        renderLib();
      }
    };
  });
}

function renderSettings(){
  $('#view-settings').innerHTML = `
    <div class="card">
      <h3>AI 文章生成（可选）</h3>
      <p class="muted">填入任意 OpenAI 兼容接口的 Key 后可一键生成文章。<br>
      不填也能用：系统会给你一段提示词，复制到 DeepSeek / ChatGPT / 豆包 / Kimi，再把返回的 JSON 粘回来即可。</p>
      <label>API Base</label>
      <input class="inp" id="sBase" value="${esc(S.settings.apiBase)}">
      <label>API Key</label>
      <input class="inp" id="sKey" type="password" value="${esc(S.settings.apiKey)}" placeholder="sk-...">
      <label>模型</label>
      <input class="inp" id="sModel" value="${esc(S.settings.model)}" placeholder="deepseek-chat">
      <button class="btn primary" id="saveSet" style="margin-top:14px">保存</button>
      <p class="muted" style="margin-top:10px">Key 只存在你自己手机浏览器里，不会上传到 GitHub，别人看不到。</p>
    </div>

    <div class="card">
      <h3>数据备份</h3>
      <p class="muted">换手机或清缓存前记得备份。</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
        <button class="btn" id="exportBtn" style="margin:0">下载备份</button>
        <button class="btn" id="copyBackup" style="margin:0">复制备份</button>
        <button class="btn" id="importBtn" style="margin:0">恢复备份</button>
      </div>
      <button class="btn danger" id="clearBtn" style="margin-top:12px">清空全部数据</button>
      <input type="file" id="fileIn" accept="application/json" style="display:none">
    </div>`;

  $('#saveSet').onclick = () => {
    S.settings.apiBase = $('#sBase').value.trim() || 'https://api.deepseek.com/v1';
    S.settings.apiKey  = $('#sKey').value.trim();
    S.settings.model   = $('#sModel').value.trim() || 'deepseek-chat';
    save();
    $('#saveSet').textContent = '已保存 ✓';
    setTimeout(() => $('#saveSet').textContent = '保存', 1500);
  };

  $('#exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cet6-words-' + todayStr() + '.json';
    a.click();
  };

  $('#copyBackup').onclick = async () => {
    try{
      await navigator.clipboard.writeText(JSON.stringify(S));
      alert('备份内容已复制，粘贴到备忘录或发给自己保存');
    }catch(e){
      alert('复制失败，请改用「下载备份」');
    }
  };

  $('#importBtn').onclick = () => $('#fileIn').click();

  $('#fileIn').onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const o = JSON.parse(r.result);
        if(o.words){
          S.words = o.words;
          S.settings = Object.assign(S.settings, o.settings || {});
          save();
          alert('恢复成功');
          renderSettings();
        }else{
          alert('文件格式不对');
        }
      }catch(err){ alert('解析失败'); }
    };
    r.readAsText(f);
  };

  $('#clearBtn').onclick = () => {
    if(confirm('确定清空所有单词和进度？此操作不可恢复')){
      try{
        localStorage.removeItem(DB_KEY);
        localStorage.removeItem('cet6_tr_cache');
      }catch(e){}
      location.reload();
    }
  };
}
